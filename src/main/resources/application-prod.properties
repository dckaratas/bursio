#  Database 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#  JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

#  Flyway 
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#  JWT 
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000

#  Brevo 
brevo.api-key=${BREVO_API_KEY}
brevo.from-email=noreply@bursio.com.tr
brevo.from-name=BursIO

#  URLs / CORS 
app.base-url=https://bursio.com.tr
app.frontend-url=https://bursio.com.tr
cors.allowed-origins=https://bursio.com.tr

#  Logging 
logging.level.com.falcon.bursio=INFO

#  Swagger (production'da kapalı) 
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# JPA
spring.jpa.open-in-view=false
