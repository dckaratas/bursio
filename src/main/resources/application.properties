# ?? Database ??????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:61693/bursio
spring.datasource.username=bursio_user
spring.datasource.password=${DB_PASSWORD}

# ?? JPA / Hibernate ???????????????????????????????????
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?? Flyway ????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000

# Brevo
brevo.api-key=${BREVO_API_KEY}
#noreply@bursio.com
brevo.from-email=${BREVO_FROM_EMAIL:noreply@bursio.com.tr}
brevo.from-name=BursIO

#TODO:prod da de?i?tir
app.base-url=http://localhost:8080
cors.allowed-origins=http://localhost:3000
app.frontend-url=http://localhost:3000
logging.level.com.falcon.bursio=DEBUG